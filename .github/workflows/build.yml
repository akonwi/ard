name: Release Binaries

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (for example, v0.36.0 or v0.36.0-rc1)
        required: true
        type: string
      notes:
        description: Final user-facing release notes
        required: true
        type: string

# Serialize the complete release flow so stable versions cannot race and
# overwrite Homebrew with an older formula.
concurrency:
  group: release
  cancel-in-progress: false

env:
  GOEXPERIMENT: jsonv2

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require main
        env:
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [[ "$REF" != "refs/heads/main" ]]; then
            echo "Releases must be dispatched from main, got $REF" >&2
            exit 1
          fi

      - name: Validate release version and availability
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc[0-9]+)?$ ]]; then
            echo "Invalid release version: $VERSION" >&2
            exit 1
          fi

          require_absent() {
            local resource="$1"
            local label="$2"
            local body
            body="$(mktemp)"
            local status
            status="$(curl --silent --show-error \
              --output "$body" \
              --write-out '%{http_code}' \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPOSITORY}/${resource}")"
            case "$status" in
              404) ;;
              200)
                echo "$label already exists: $VERSION" >&2
                exit 1
                ;;
              *)
                echo "Could not check $label availability (HTTP $status)" >&2
                cat "$body" >&2
                exit 1
                ;;
            esac
          }

          require_absent "git/ref/tags/${VERSION}" "Tag"
          require_absent "releases/tags/${VERSION}" "Release"

  test:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: compiler/go.sum

      - name: Download dependencies
        working-directory: compiler
        run: go mod download

      - name: Run tests
        working-directory: compiler
        run: go test ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: compiler/go.sum

      - name: Download dependencies
        working-directory: compiler
        run: go mod download

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
          VERSION: ${{ inputs.version }}
        working-directory: compiler
        run: |
          go build \
            -ldflags="-X github.com/akonwi/ard/version.Version=${VERSION}" \
            -o ard \
            .

      - name: Package binary
        env:
          VERSION: ${{ inputs.version }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          TAR_NAME="ard_${VERSION}_${GOOS}_${GOARCH}.tar.gz"
          tar -czf "dist/${TAR_NAME}" -C compiler ard

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ard_${{ inputs.version }}_${{ matrix.goos }}_${{ matrix.goarch }}
          path: dist/*.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          pattern: ard_${{ inputs.version }}_*
          merge-multiple: true

      - name: Generate checksums
        run: sha256sum dist/*.tar.gz > dist/checksums.txt

      - name: Create and verify tag at tested commit
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          REPOSITORY: ${{ github.repository }}
          TESTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/${REPOSITORY}/git/refs" \
            --field "ref=refs/tags/${VERSION}" \
            --field "sha=${TESTED_SHA}" >/dev/null
          TAG_SHA="$(gh api "repos/${REPOSITORY}/git/ref/tags/${VERSION}" --jq '.object.sha')"
          if [[ "$TAG_SHA" != "$TESTED_SHA" ]]; then
            echo "Created tag points to $TAG_SHA, expected $TESTED_SHA" >&2
            exit 1
          fi

      - name: Create release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ inputs.version }}
          prerelease: ${{ contains(inputs.version, '-rc') }}
          body: ${{ inputs.notes }}
          files: |
            dist/*.tar.gz
            dist/checksums.txt

  update-homebrew-tap:
    needs: release
    runs-on: ubuntu-latest
    if: ${{ !contains(inputs.version, '-rc') }}
    permissions:
      contents: read
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          pattern: ard_${{ inputs.version }}_*
          merge-multiple: true

      - name: Generate checksums
        run: sha256sum dist/*.tar.gz > dist/checksums.txt

      - name: Checkout Homebrew tap
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: akonwi/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Update Ard formula
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          SEMVER="${VERSION#v}"
          CURRENT_VERSION="$(sed -nE 's/^[[:space:]]*version "([0-9]+\.[0-9]+\.[0-9]+)"$/\1/p' homebrew-tap/Formula/ard.rb)"
          if [[ -z "$CURRENT_VERSION" ]]; then
            echo "Could not parse the current Homebrew formula version" >&2
            exit 1
          fi
          IFS=. read -r new_major new_minor new_patch <<<"$SEMVER"
          IFS=. read -r current_major current_minor current_patch <<<"$CURRENT_VERSION"
          if (( new_major < current_major ||
                new_major == current_major && new_minor < current_minor ||
                new_major == current_major && new_minor == current_minor && new_patch <= current_patch )); then
            echo "Homebrew already has ${CURRENT_VERSION}; refusing to replace it with ${SEMVER}"
            exit 0
          fi

          DARWIN_AMD64_SHA="$(grep "ard_${VERSION}_darwin_amd64.tar.gz" dist/checksums.txt | awk '{print $1}')"
          DARWIN_ARM64_SHA="$(grep "ard_${VERSION}_darwin_arm64.tar.gz" dist/checksums.txt | awk '{print $1}')"
          LINUX_AMD64_SHA="$(grep "ard_${VERSION}_linux_amd64.tar.gz" dist/checksums.txt | awk '{print $1}')"
          LINUX_ARM64_SHA="$(grep "ard_${VERSION}_linux_arm64.tar.gz" dist/checksums.txt | awk '{print $1}')"

          cat > homebrew-tap/Formula/ard.rb <<FORMULA
          class Ard < Formula
            desc "Programming language and compiler"
            homepage "https://github.com/akonwi/ard"
            version "${SEMVER}"
            license "MIT"

            if OS.mac?
              if Hardware::CPU.arm?
                url "https://github.com/akonwi/ard/releases/download/${VERSION}/ard_${VERSION}_darwin_arm64.tar.gz"
                sha256 "${DARWIN_ARM64_SHA}"
              else
                url "https://github.com/akonwi/ard/releases/download/${VERSION}/ard_${VERSION}_darwin_amd64.tar.gz"
                sha256 "${DARWIN_AMD64_SHA}"
              end
            elsif OS.linux?
              if Hardware::CPU.arm? && Hardware::CPU.is_64_bit?
                url "https://github.com/akonwi/ard/releases/download/${VERSION}/ard_${VERSION}_linux_arm64.tar.gz"
                sha256 "${LINUX_ARM64_SHA}"
              else
                url "https://github.com/akonwi/ard/releases/download/${VERSION}/ard_${VERSION}_linux_amd64.tar.gz"
                sha256 "${LINUX_AMD64_SHA}"
              end
            end

            def install
              bin.install "ard"
            end

            test do
              assert_match "${VERSION}", shell_output("#{bin}/ard version")
            end
          end
          FORMULA

      - name: Commit and push formula update
        working-directory: homebrew-tap
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- Formula/ard.rb; then
            echo "Formula/ard.rb is already up to date"
            exit 0
          fi

          git add Formula/ard.rb
          git commit -m "ard ${VERSION}"
          git push
